name: Build and deploy

# Rebuilds the Log from public activity every morning (08:00 IST), on every push to
# main, and on demand. Nothing is committed back: the Log is rendered into the
# deployed artifact only, and log.manual.json stays the source for private work.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Log
        run: node scripts/build-log.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html 404.html robots.txt sitemap.xml styles.css app.js assets notes Akash_Kokare_AI_Engineer.pdf _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
